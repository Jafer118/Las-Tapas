<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wachtwoord herstellen — Las Tapas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stijl.css">
<style>
.auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.auth-box { width: min(100%, 450px); background: var(--kleur-papier); color: var(--kleur-papier-tekst); padding: 32px; border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,.35); }
.auth-back-link { display: inline-flex; align-items: center; margin-bottom: 22px; padding: 8px 12px; border: 1px solid var(--kleur-saffraan); border-radius: 6px; color: var(--kleur-saffraan); font-weight: 700; text-decoration: none; }
.auth-back-link:hover { background: rgba(233, 174, 114, .1); }
.auth-back-link:focus-visible { outline: 2px solid var(--kleur-saffraan); outline-offset: 4px; }
.auth-logo { display: block; max-width: 190px; margin: 0 auto 22px; }.auth-box h1{text-align:center;color:var(--kleur-saffraan);margin:0 0 8px;font-family:var(--font-kop)}
.auth-subtitel{text-align:center;color:var(--kleur-tekst-zacht)}.auth-box label{display:block;font-weight:700;margin:14px 0 6px}.auth-box input{width:100%;padding:11px;border:1px solid #c9b49a;border-radius:6px;font:inherit}.auth-box button{width:100%;margin-top:20px;padding:11px}.auth-link{display:block;text-align:center;margin-top:18px;color:var(--kleur-saffraan);font-weight:700}.auth-melding{white-space:pre-wrap;min-height:24px;margin:14px 0 0;text-align:center;font-weight:700}.fout{color:#F0C2C2}.goed{color:#DDE8C4}.verborgen{display:none}
</style>
</head>
<body><main class="auth-page"><section class="auth-box"><a class="auth-back-link" href="../../index.html">← Terug naar startpagina</a><img src="img/logo-las-tapas.png" alt="Las Tapas" class="auth-logo">
<h1>Wachtwoord herstellen</h1><p class="auth-subtitel">Vraag een resetlink aan met je medewerkers e-mailadres.</p>
<form id="aanvraag-form"><label for="email">E-mailadres</label><input id="email" type="email" autocomplete="email" required><button class="primair">Resetlink aanvragen</button></form>
<form id="reset-form" class="verborgen"><label for="nieuw">Nieuw wachtwoord</label><input id="nieuw" type="password" minlength="10" required><label for="herhaal">Herhaal wachtwoord</label><input id="herhaal" type="password" minlength="10" required><button class="primair">Wachtwoord opslaan</button></form>
<p id="melding" class="auth-melding"></p><a class="auth-link" href="login.html">Terug naar inloggen</a></section></main>
<script>
const authEndpoint = '../backend/api/auth.php';
const messageElement = document.getElementById('melding');
const queryParameters = new URLSearchParams(location.search);
const resetToken = queryParameters.get('token');
const requestForm = document.getElementById('aanvraag-form');
const resetForm = document.getElementById('reset-form');
const emailInput = document.getElementById('email');
const newPasswordInput = document.getElementById('nieuw');
const repeatedPasswordInput = document.getElementById('herhaal');
const csrfTokenPromise = fetch(`${authEndpoint}?actie=me`, { credentials: 'same-origin' })
	.then((response) => response.json())
	.then((responseData) => responseData.csrf_token || '');

if (resetToken) {
	requestForm.classList.add('verborgen');
	resetForm.classList.remove('verborgen');
	document.querySelector('.auth-subtitel').textContent = 'Kies een nieuw wachtwoord van minimaal 10 tekens.';
}

function showMessage(messageText, isSuccess = false) {
	messageElement.textContent = messageText;
	messageElement.className = `auth-melding ${isSuccess ? 'goed' : 'fout'}`;
}

async function postAuthAction(action, requestData) {
	const csrfToken = await csrfTokenPromise;
	const response = await fetch(`${authEndpoint}?actie=${action}`, {
		method: 'POST',
		credentials: 'same-origin',
		headers: {
			'Content-Type': 'application/json',
			'X-CSRF-Token': csrfToken,
		},
		body: JSON.stringify(requestData),
	});
	const responseData = await response.json();

	if (!response.ok) {
		throw new Error(responseData.fout || `Aanvraag mislukt (HTTP ${response.status}).`);
	}

	return responseData;
}

requestForm.addEventListener('submit', async (event) => {
	event.preventDefault();
	try {
		const responseData = await postAuthAction('reset_aanvragen', { email: emailInput.value });
		if (responseData.reset_link) {
			showMessage(
				'Resetlink aangemaakt. Open deze link om je wachtwoord te wijzigen:\n' + responseData.reset_link,
				true
			);
		} else {
			showMessage(responseData.bericht, true);
		}
	} catch (error) {
		showMessage(error.message);
	}
});

resetForm.addEventListener('submit', async (event) => {
	event.preventDefault();
	if (newPasswordInput.value !== repeatedPasswordInput.value) {
		showMessage('De wachtwoorden zijn niet gelijk.');
		return;
	}

	try {
		const responseData = await postAuthAction('wachtwoord_resetten', {
			token: resetToken,
			nieuw_wachtwoord: newPasswordInput.value,
		});
		showMessage(responseData.bericht, true);
		resetForm.reset();
		setTimeout(() => { location.href = 'login.html'; }, 1200);
	} catch (error) {
		showMessage(error.message);
	}
});
</script></body></html>
