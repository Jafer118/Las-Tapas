<script>
function showMessage(messageText) {
    document.getElementById('melding').style.display = 'block';
    document.getElementById('melding').textContent = messageText;
}

let receiptQuery = '';

async function loadReceipt() {
    const queryParameters = new URLSearchParams(window.location.search);
    const tableId = queryParameters.get('tafel_id');
    const orderId = queryParameters.get('bestelling_id');

    if (!tableId && !orderId) {
        showMessage('Geen tafel of bestelling opgegeven. Open dit bonnetje vanaf de kassapagina.');
        return;
    }

    receiptQuery = orderId ? `bestelling_id=${orderId}` : `tafel_id=${tableId}`;
    const receiptData = await apiGet(`bon_gegevens.php?${receiptQuery}`);

    if (!receiptData.succes) {
        showMessage(receiptData.fout || 'Geen bonnetje gevonden voor deze bestelling.');
        return;
    }

    document.title = `Bon — ${receiptData.tafel_naam}`;
    document.getElementById('bon-tafel').textContent = receiptData.tafel_naam;
    document.getElementById('bon-datum').textContent = new Date(receiptData.datum_tijd.replace(' ', 'T'))
        .toLocaleString('nl-NL', { dateStyle: 'short', timeStyle: 'short' });
    document.getElementById('bon-nummer').textContent = `#${String(receiptData.bestelling_id).padStart(5, '0')}`;

    if (receiptData.aantal_personen) {
        document.getElementById('bon-personen-rij').style.display = 'flex';
        document.getElementById('bon-personen').textContent = receiptData.aantal_personen;
    }

    const orderLinesContainer = document.getElementById('bon-regels');
    orderLinesContainer.innerHTML = '';
    receiptData.orderregels.forEach(orderLine => {
        const lineElement = document.createElement('div');
        lineElement.className = 'bon-regel';
        lineElement.innerHTML = `
            <span class="naam-aantal">${orderLine.aantal}× ${orderLine.gerecht_naam}</span>
            <span>${formatCurrency(orderLine.subtotaal)}</span>
        `;
        orderLinesContainer.appendChild(lineElement);
    });

    document.getElementById('bon-totaal').textContent = formatCurrency(receiptData.totaal);
    document.getElementById('bon-inhoud').style.display = 'block';
}

function downloadPdf() {
    window.open(`${API_BASE}/bon_pdf.php?${receiptQuery}`, '_blank');
}

loadReceipt();
</script>
