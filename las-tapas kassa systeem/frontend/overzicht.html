<script src="js/gedeeld.js"></script>
<script>
async function loadDashboard() {
    await Promise.all([
        loadTableOverview(),
        loadOrderColumn('keuken_bestellingen.php', 'keuken-inhoud'),
        loadOrderColumn('bar_bestellingen.php', 'bar-inhoud'),
    ]);
}

async function loadTableOverview() {
    const tableData = await apiGet('tafels_ophalen.php');
    const occupiedTables = tableData.tafels.filter((table) => table.status === 'bezet');
    const overviewContent = document.getElementById('tafel-overzicht-inhoud');
    const overviewFooter = document.getElementById('tafel-overzicht-footer');

    if (occupiedTables.length === 0) {
        overviewContent.innerHTML = '<p class="db-geen-tafels">Geen bezette tafels op dit moment.</p>';
        overviewFooter.innerHTML = '';
        return;
    }

    let totalForAllTables = 0;
    let tableCardsHtml = '';

    for (const table of occupiedTables) {
        const billData = await apiGet(`rekening.php?tafel_id=${table.id}`);
        const activeOrderCount = (billData.orderregels || [])
            .filter((orderLine) => orderLine.status !== 'geserveerd').length;
        totalForAllTables += billData.totaal || 0;
        const guestCountText = billData.aantal_personen
            ? `${billData.aantal_personen} / ${table.capaciteit} personen`
            : `max ${table.capaciteit} personen`;

        tableCardsHtml += `
            <div class="db-tafelkaart">
                <div class="naam">${table.naam}</div>
                <div class="actief-label">${activeOrderCount} actieve order${activeOrderCount === 1 ? '' : 's'} — ${guestCountText}</div>
                <div class="regel">
                    <span>Openstaand bedrag</span>
                    <span>${formatCurrency(billData.totaal || 0)}</span>
                </div>
            </div>
        `;
    }

    overviewContent.innerHTML = tableCardsHtml;
    overviewFooter.innerHTML = `<span>${occupiedTables.length} tafel${occupiedTables.length === 1 ? '' : 's'} open</span><span>TOTAAL: ${formatCurrency(totalForAllTables)}</span>`;
}

async function loadOrderColumn(endpointPath, containerId) {
    const orderData = await apiGet(endpointPath);
    const orderContainer = document.getElementById(containerId);
    const orderLines = orderData.orderregels || [];

    if (orderLines.length === 0) {
        orderContainer.innerHTML = '<p class="db-geen-tafels">Geen openstaande bestellingen.</p>';
        return;
    }

    const ordersByTable = {};
    orderLines.forEach((orderLine) => {
        if (!ordersByTable[orderLine.tafel_id]) {
            ordersByTable[orderLine.tafel_id] = { naam: orderLine.tafel_naam, regels: [] };
        }
        ordersByTable[orderLine.tafel_id].regels.push(orderLine);
    });

    let orderCardsHtml = '';
    Object.values(ordersByTable).forEach((tableGroup) => {
        const lastOrderTime = tableGroup.regels[tableGroup.regels.length - 1].besteld_op;
        let orderLinesHtml = '';
        tableGroup.regels.forEach((orderLine) => {
            const statusBadge = orderLine.status === 'bereid'
                ? '<span class="db-badge bezig">BEZIG</span>'
                : '<span class="db-badge nieuw">NIEUW</span>';
            orderLinesHtml += `
                <div class="db-orderregel">
                    <span>${orderLine.gerecht_naam} (${orderLine.aantal})</span>
                    ${statusBadge}
                </div>
            `;
        });

        orderCardsHtml += `
            <div class="db-orderkaart">
                <div class="kop">
                    <span>${tableGroup.naam}</span>
                    <span class="tijd">${formatTime(lastOrderTime)}</span>
                </div>
                ${orderLinesHtml}
            </div>
        `;
    });

    orderContainer.innerHTML = orderCardsHtml;
}

setInterval(loadDashboard, 5000);
loadDashboard();
</script>
