<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — Las Tapas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stijl.css">
<style>
.auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.auth-box { width: min(100%, 430px); background: var(--kleur-papier); color: var(--kleur-papier-tekst); padding: 32px; border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,.35); }
.auth-logo { display: block; max-width: 190px; margin: 0 auto 22px; }
.auth-back-link { display: inline-flex; align-items: center; min-height: 48px; margin-bottom: 22px; padding: 12px 18px; border: 1px solid var(--kleur-saffraan); border-radius: 6px; color: var(--kleur-saffraan); font-size: 1rem; font-weight: 700; text-decoration: none; }
.auth-back-link:hover { background: rgba(233, 174, 114, .1); }
.auth-back-link:focus-visible { outline: 2px solid var(--kleur-saffraan); outline-offset: 4px; }
.auth-box h1 { text-align: center; color: var(--kleur-saffraan); margin: 0 0 8px; font-family: var(--font-kop); }
.auth-subtitel { text-align: center; margin: 0 0 24px; color: var(--kleur-tekst-zacht); }
.auth-box label { display: block; font-weight: 700; margin: 14px 0 6px; }
.auth-box input { width: 100%; padding: 11px; border: 1px solid #c9b49a; border-radius: 6px; font: inherit; }
.auth-box button { width: 100%; margin-top: 20px; padding: 11px; }
.auth-link { display: block; text-align: center; margin-top: 18px; color: var(--kleur-wijn); font-weight: 700; }
.auth-melding { min-height: 24px; margin: 14px 0 0; text-align: center; font-weight: 700; }
.auth-melding.fout { color: #F0C2C2; }
.auth-melding.goed { color: #DDE8C4; }
</style>
</head>
<body>
<main class="auth-page"><section class="auth-box">
<a class="auth-back-link" href="../../Las%20Tapas/Frontend/index.html">← Terug naar startpagina</a>
<img src="img/logo-las-tapas.png" alt="Las Tapas" class="auth-logo">
<h1>Medewerkerslogin</h1><p class="auth-subtitel">Log in om het restaurantdashboard te openen.</p>
<form id="login-form">
<label for="email">E-mailadres of gebruikersnaam</label><input id="email" type="text" inputmode="email" autocomplete="username" required>
<label for="wachtwoord">Wachtwoord</label><input id="wachtwoord" type="password" autocomplete="current-password" required>
<button class="primair" type="submit">Inloggen</button>
<p id="melding" class="auth-melding"></p>
</form>
<a class="auth-link" href="resetten.html">Wachtwoord vergeten?</a>
</section></main>
<script>
const authEndpoint = '../backend/api/auth.php';
const messageElement = document.getElementById('melding');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('wachtwoord');
const loginForm = document.getElementById('login-form');
const csrfTokenPromise = fetch(`${authEndpoint}?actie=me`, { credentials: 'same-origin' })
    .then((response) => response.json())
    .then((responseData) => responseData.csrf_token || '');

function showLoginMessage(messageText, messageType = '') {
    messageElement.className = `auth-melding ${messageType}`.trim();
    messageElement.textContent = messageText;
}

loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    showLoginMessage('Bezig met inloggen…');

    const enteredEmail = emailInput.value.trim().toLowerCase();
    const email = enteredEmail === 'admin' ? 'admin@lastapas.nl' : enteredEmail;
    try {
        const csrfToken = await csrfTokenPromise;
        const response = await fetch(`${authEndpoint}?actie=login`, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
            body: JSON.stringify({ email, wachtwoord: passwordInput.value }),
        });
        const responseData = await response.json();
        if (!response.ok || !responseData.succes) {
            showLoginMessage(responseData.fout || `Inloggen mislukt (HTTP ${response.status}).`, 'fout');
            return;
        }

        const requestedNext = new URLSearchParams(location.search).get('next') || 'overzicht.html';
        const next = /^[a-z0-9_-]+\.html(?:\?.*)?$/i.test(requestedNext) ? requestedNext : 'overzicht.html';
        location.href = next;
    } catch (error) {
        showLoginMessage(
            'De server kan niet worden bereikt. Open deze pagina via localhost/WAMP en niet als lokaal bestand.',
            'fout'
        );
    }
});
</script>
</body>
</html>
