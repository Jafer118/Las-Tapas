<script src="js/gedeeld.js"></script>
<script>
async function laadVoorraad() {
    const data = await apiGet('gerechten_ophalen.php');
    const body = document.getElementById('voorraad-body');
    body.innerHTML = '';

    data.gerechten.forEach(g => {
        const laag = g.voorraad <= 5;
        const rij = document.createElement('tr');
        rij.innerHTML = `
            <td>${g.naam}</td>
            <td>${g.categorie}</td>
            <td>${formatEuro(g.prijs)}</td>
            <td class="${laag ? 'voorraad-laag' : ''}">${g.voorraad}${laag ? ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg> laag' : ''}</td>
        `;
        body.appendChild(rij);
    });
}

laadVoorraad();
setInterval(laadVoorraad, 10000);
</script>
