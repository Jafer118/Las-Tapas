<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

<title>Las Tapas — Kassa</title>
<link rel="stylesheet" href="css/stijl.css">
</head>
<body>

<header class="topbar">
    <div class="titel">
        <img src="img/logo-las-tapas.jpg" alt="Las Tapas logo" class="logo">
        <div>
            <h1>Bar de España</h1>
            <span class="restaurant">Las Tapas — Kassa</span>
        </div>
    </div>
</header>

<nav class="subnav">
    <a href="kassa.html" class="actief">Kassa</a>
</nav>

<main>
    <div id="melding-plek"></div>

    <div class="kolommen">
        <div class="paneel">
            <h2>Bezette tafels</h2>
            <div id="tafel-lijst"></div>
        </div>

        <div class="paneel">
            <h2 id="rekening-titel">Selecteer een tafel</h2>
            <div id="rekening-details"></div>
        </div>
    </div>
</main>

<script src="js/gedeeld.js"></script>
<script>
let gekozenTafelId = null;

async function laadTafels() {
    const data = await apiGet('tafels_ophalen.php');
    const container = document.getElementById('tafel-lijst');
    container.innerHTML = '';

    const bezetteTafels = data.tafels.filter(t => t.status === 'bezet');

    if (bezetteTafels.length === 0) {
        container.innerHTML = '<p style="color:#a9bccb;">Geen bezette tafels op dit moment.</p>';
        return;
    }

    bezetteTafels.forEach(t => {
        const kaart = document.createElement('div');
        kaart.className = 'tafel-kaart';
        kaart.style.cursor = 'pointer';
        kaart.innerHTML = `
            <span>${t.naam}</span>
            <span class="status-bezet">bezet</span>
        `;
        kaart.addEventListener('click', () => toonRekening(t.id, t.naam));
        container.appendChild(kaart);
    });
}

async function toonRekening(tafelId, tafelNaam) {
    gekozenTafelId = tafelId;
    document.getElementById('rekening-titel').textContent = `Rekening — ${tafelNaam}`;

    const data = await apiGet(`rekening.php?tafel_id=${tafelId}`);
    const container = document.getElementById('rekening-details');

    if (!data.bestelling_id) {
        container.innerHTML = '<p>Geen openstaande bestelling voor deze tafel.</p>';
        return;
    }

    let html = '';

    if (data.aantal_personen) {
        html += `<p style="color:#C9AC93; font-size:0.85rem; margin-top:0;">${data.aantal_personen} personen aan tafel</p>`;
    }

    data.orderregels.forEach(r => {
        html += `
            <div class="regel-item">
                <span>${r.gerecht_naam} × ${r.aantal}</span>
                <span>${formatEuro(r.subtotaal)}</span>
            </div>
        `;
    });

    html += `
        <hr style="border-color:#24435e;margin:12px 0;">
        <div class="regel-item" style="font-size:1.2rem;font-weight:700;">
            <span>Totaal</span>
            <span>${formatEuro(data.totaal)}</span>
        </div>
        <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
            <button class="secundair" style="flex:1;" onclick="bekijkBon(${tafelId})">
                Bonnetje bekijken / printen
            </button>
            <a class="secundair" style="flex:1; text-align:center; padding:6px 12px; border-radius:6px; text-decoration:none; display:inline-block;"
               href="../backend/api/bon_pdf.php?tafel_id=${tafelId}" target="_blank">
                PDF downloaden
            </a>
            <button class="primair" style="flex:1;" onclick="rekenAf()">
                Afrekenen
            </button>
        </div>
    `;

    container.innerHTML = html;
}

function bekijkBon(tafelId) {
    window.open(`bon.html?tafel_id=${tafelId}`, '_blank');
}

async function rekenAf() {
    if (!gekozenTafelId) return;

    const resultaat = await apiPost('afrekenen.php', { tafel_id: gekozenTafelId });
    const plek = document.getElementById('melding-plek');

    if (resultaat.succes) {
        const bestellingId = resultaat.bestelling_id;
        const opgeslagenEmail = resultaat.klant_email || '';

        plek.innerHTML = `
            <div class="melding succes">
                <div style="margin-bottom:10px;">Tafel succesvol afgerekend. Tafel is weer vrij.</div>

                <div style="margin-bottom:10px;">
                    <strong>Stap 1 —</strong> download het bonnetje:
                    <a class="secundair" style="padding:6px 12px; border-radius:6px; text-decoration:none; margin-left:6px; display:inline-block;"
                       href="../backend/api/bon_pdf.php?bestelling_id=${bestellingId}" target="_blank">
                        PDF downloaden
                    </a>
                    <a class="secundair" style="padding:6px 12px; border-radius:6px; text-decoration:none; margin-left:6px; display:inline-block;"
                       href="bon.html?bestelling_id=${bestellingId}" target="_blank">
                        Bonnetje bekijken
                    </a>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                    <strong>Stap 2 —</strong>
                    <input type="email" id="mail-naar-klant" placeholder="e-mailadres klant"
                           value="${opgeslagenEmail}"
                           style="padding:6px 8px; border-radius:6px; border:1px solid #ccc; min-width:220px;">
                    <button class="primair" onclick="openGmail(${bestellingId})">Openen in Gmail</button>
                </div>

                <div style="margin-top:8px; font-size:0.8rem; color:#c8e6d5;">
                    Gmail opent met de e-mail al ingevuld. Voeg daar de gedownloade PDF toe als bijlage en verstuur.
                </div>
            </div>
        `;
        document.getElementById('rekening-titel').textContent = 'Selecteer een tafel';
        document.getElementById('rekening-details').innerHTML = '';
        gekozenTafelId = null;
        laadTafels();
    } else {
        plek.innerHTML = `<div class="melding fout">Fout: ${resultaat.fout}</div>`;
        setTimeout(() => { plek.innerHTML = ''; }, 4000);
    }
}

/**
 * Opent Gmail in een nieuw tabblad met ontvanger, onderwerp en berichttekst
 * al ingevuld. De PDF voegt de medewerker zelf toe als bijlage (browsers
 * mogen om veiligheidsredenen geen bestanden automatisch koppelen).
 */
function openGmail(bestellingId) {
    const email = document.getElementById('mail-naar-klant').value.trim();

    const onderwerp = 'Uw bonnetje van Las Tapas';
    const bericht =
        'Beste gast,\n\n' +
        'Bedankt voor uw bezoek aan Las Tapas! In de bijlage vindt u uw bonnetje ' +
        '(bonnummer #' + String(bestellingId).padStart(5, '0') + ').\n\n' +
        'Tot ziens!\n' +
        'Team Las Tapas';

    const gmailUrl = 'https://mail.google.com/mail/?view=cm&fs=1'
        + '&to=' + encodeURIComponent(email)
        + '&su=' + encodeURIComponent(onderwerp)
        + '&body=' + encodeURIComponent(bericht);

    window.open(gmailUrl, '_blank');
}

setInterval(laadTafels, 8000);
laadTafels();
</script>
</body>
</html>
