<script src="js/gedeeld.js"></script>
<script>
async function laadDashboard() {
    await Promise.all([laadTafelOverzicht(), laadOrderKolom('keuken_bestellingen.php', 'keuken-inhoud'), laadOrderKolom('bar_bestellingen.php', 'bar-inhoud')]);
}

// ---------- Kolom 1: Tafel overzicht ----------
async function laadTafelOverzicht() {
    const tafelData = await apiGet('tafels_ophalen.php');
    const bezetteTafels = tafelData.tafels.filter(t => t.status === 'bezet');
    const inhoud = document.getElementById('tafel-overzicht-inhoud');
    const footer = document.getElementById('tafel-overzicht-footer');

    if (bezetteTafels.length === 0) {
        inhoud.innerHTML = '<p class="db-geen-tafels">Geen bezette tafels op dit moment.</p>';
        footer.innerHTML = '';
        return;
    }

    let totaalAlleTafels = 0;
    let htmlKaarten = '';

    for (const tafel of bezetteTafels) {
        const rekening = await apiGet(`rekening.php?tafel_id=${tafel.id}`);
        const actieveOrders = (rekening.orderregels || []).filter(r => r.status !== 'geserveerd').length;
        totaalAlleTafels += rekening.totaal || 0;

        htmlKaarten += `
            <div class="db-tafelkaart">
                <div class="naam">${tafel.naam}</div>
                <div class="actief-label">${actieveOrders} actieve order${actieveOrders === 1 ? '' : 's'}</div>
                <div class="regel">
                    <span>Openstaand bedrag</span>
                    <span>${formatEuro(rekening.totaal || 0)}</span>
                </div>
            </div>
        `;
    }

    inhoud.innerHTML = htmlKaarten;
    footer.innerHTML = `<span>${bezetteTafels.length} tafel${bezetteTafels.length === 1 ? '' : 's'} open</span><span>TOTAAL: ${formatEuro(totaalAlleTafels)}</span>`;
}

// ---------- Kolom 2 & 3: Keuken / Bar bestellingen ----------
async function laadOrderKolom(endpoint, containerId) {
    const data = await apiGet(endpoint);
    const container = document.getElementById(containerId);
    const regels = data.orderregels || [];

    if (regels.length === 0) {
        container.innerHTML = '<p class="db-geen-tafels">Geen openstaande bestellingen.</p>';
        return;
    }

    // Groepeer per tafel
    const perTafel = {};
    regels.forEach(r => {
        if (!perTafel[r.tafel_id]) perTafel[r.tafel_id] = { naam: r.tafel_naam, regels: [] };
        perTafel[r.tafel_id].regels.push(r);
    });

    let html = '';
    Object.values(perTafel).forEach(tafel => {
        const laatsteTijd = tafel.regels[tafel.regels.length - 1].besteld_op;
        let regelsHtml = '';
        tafel.regels.forEach(r => {
            const badge = r.status === 'bereid'
                ? '<span class="db-badge bezig">BEZIG</span>'
                : '<span class="db-badge nieuw">NIEUW</span>';
            regelsHtml += `
                <div class="db-orderregel">
                    <span>${r.gerecht_naam} (${r.aantal})</span>
                    ${badge}
                </div>
            `;
        });

        html += `
            <div class="db-orderkaart">
                <div class="kop">
                    <span>${tafel.naam}</span>
                    <span class="tijd">${formatTijd(laatsteTijd)}</span>
                </div>
                ${regelsHtml}
            </div>
        `;
    });

    container.innerHTML = html;
}

setInterval(laadDashboard, 5000);
laadDashboard();
</script>
