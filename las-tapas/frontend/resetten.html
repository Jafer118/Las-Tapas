<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wachtwoord herstellen — Las Tapas</title><link rel="stylesheet" href="css/stijl.css">
<style>
.auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.auth-box { width: min(100%, 450px); background: var(--kleur-papier); color: var(--kleur-papier-tekst); padding: 32px; border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,.35); }
.auth-logo { display: block; max-width: 190px; margin: 0 auto 22px; }.auth-box h1{text-align:center;color:var(--kleur-bodega);margin:0 0 8px;font-family:var(--font-kop)}
.auth-subtitel{text-align:center;color:#725044}.auth-box label{display:block;font-weight:700;margin:14px 0 6px}.auth-box input{width:100%;padding:11px;border:1px solid #c9b49a;border-radius:6px;font:inherit}.auth-box button{width:100%;margin-top:20px;padding:11px}.auth-link{display:block;text-align:center;margin-top:18px;color:var(--kleur-wijn);font-weight:700}.auth-melding{white-space:pre-wrap;min-height:24px;margin:14px 0 0;text-align:center;font-weight:700}.fout{color:#8c2f39}.goed{color:#557039}.verborgen{display:none}
</style>
</head>
<body><main class="auth-page"><section class="auth-box"><img src="img/logo-las-tapas.png" alt="Las Tapas" class="auth-logo">
<h1>Wachtwoord herstellen</h1><p class="auth-subtitel">Vraag een resetlink aan met je medewerkers e-mailadres.</p>
<form id="aanvraag-form"><label for="email">E-mailadres</label><input id="email" type="email" autocomplete="email" required><button class="primair">Resetlink aanvragen</button></form>
<form id="reset-form" class="verborgen"><label for="nieuw">Nieuw wachtwoord</label><input id="nieuw" type="password" minlength="10" required><label for="herhaal">Herhaal wachtwoord</label><input id="herhaal" type="password" minlength="10" required><button class="primair">Wachtwoord opslaan</button></form>
<p id="melding" class="auth-melding"></p><a class="auth-link" href="login.html">Terug naar inloggen</a></section></main>
<script>
const endpoint='../backend/api/auth.php', melding=document.getElementById('melding'), params=new URLSearchParams(location.search), token=params.get('token');
const aanvraag=document.getElementById('aanvraag-form'), reset=document.getElementById('reset-form');
if(token){ aanvraag.classList.add('verborgen'); reset.classList.remove('verborgen'); document.querySelector('.auth-subtitel').textContent='Kies een nieuw wachtwoord van minimaal 10 tekens.'; }
function toon(tekst, goed=false){melding.textContent=tekst;melding.className='auth-melding '+(goed?'goed':'fout');}
aanvraag.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch(endpoint+'?actie=reset_aanvragen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const d=await r.json();if(d.reset_link){toon('Resetlink aangemaakt. Open deze link om je wachtwoord te wijzigen:\n'+d.reset_link,true)}else toon(d.bericht,true)});
reset.addEventListener('submit',async e=>{e.preventDefault();if(nieuw.value!==herhaal.value)return toon('De wachtwoorden zijn niet gelijk.');const r=await fetch(endpoint+'?actie=wachtwoord_resetten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,nieuw_wachtwoord:nieuw.value})});const d=await r.json();if(!d.succes)return toon(d.fout);toon(d.bericht,true);reset.reset();setTimeout(()=>location.href='login.html',1200)});
</script></body></html>
